name: Generate sitemap.xml

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '.github/workflows/generate-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sitemap.xml
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://containnect.com"
          TODAY=$(date +%Y-%m-%d)

          # Preserve the existing exclusions for root-level pages.
          EXCLUDE_PATTERN="404|privacy|terms"

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          } > sitemap.xml

          # Root pages plus the generated physics topic pages.
          # Do not scan the entire repository, which can include tooling/tests.
          shopt -s nullglob
          files=( *.html physics-topics/*.html en/*.html en/news/*.html en/physics-topics/*.html )
          if (( ${#files[@]} == 0 )); then
            echo "No HTML pages found" >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            if [[ "$file" != physics-topics/* ]] && echo "$file" | grep -qiE "$EXCLUDE_PATTERN"; then
              continue
            fi

            if [[ "$file" == "index.html" ]]; then
              loc="${BASE_URL}/"
              priority="1.0"
            elif [[ "$file" == */index.html ]]; then
              loc="${BASE_URL}/${file%index.html}"
              priority="0.9"
            else
              loc="${BASE_URL}/${file}"
              priority="0.9"
            fi

            {
              echo "  <url>"
              echo "    <loc>${loc}</loc>"
              echo "    <lastmod>${TODAY}</lastmod>"
              echo "    <changefreq>monthly</changefreq>"
              echo "    <priority>${priority}</priority>"
              echo "  </url>"
            } >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      - name: Validate topic URLs and sitemap XML
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse('sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [el.text for el in root.findall('sm:url/sm:loc', ns)]
          if len(urls) != len(set(urls)):
              raise SystemExit('Duplicate sitemap URLs')
          index = json.loads(Path('data/learning-content-index.json').read_text())
          expected = {
              'https://containnect.com/physics-topics/' + str(section['id']).replace('.', '-') + '.html'
              for section in index['sections']
          }
          actual = {url for url in urls if '/physics-topics/' in url and '/en/' not in url}
          if actual != expected:
              raise SystemExit(f'Topic URL mismatch: missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          english_expected = {
              'https://containnect.com/en/physics-topics/' + str(section['id']).replace('.', '-') + '.html'
              for section in index['sections']
              if section.get('english', {}).get('metadataComplete') is True
              and section['english'].get('title') and section['english'].get('summary')
              and section['english'].get('chapterTitle')
          }
          english_actual = {
              url for url in urls
              if url.startswith('https://containnect.com/en/physics-topics/')
              and url.endswith('.html')
          }
          if english_actual != english_expected:
              raise SystemExit(f'English topic URL mismatch: missing={sorted(english_expected-english_actual)} extra={sorted(english_actual-english_expected)}')
          print(f'Validated {len(actual)} Japanese and {len(english_actual)} English topic URLs, {len(urls)} total URLs')
          PY

      - name: Commit sitemap.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "chore: auto-update sitemap.xml [skip ci]"
          git push
